# Seed phase — load whatever fixtures make this use case meaningful.
#
# suspend: true is deliberate. Applying the overlay creates the Job without
# starting it; the runner decides the order (seed -> run -> verify) and
# un-suspends one at a time.
apiVersion: batch/v1
kind: Job
metadata:
  name: __PREFIX__-seed
  namespace: __NAMESPACE__
  labels:
    app: __PREFIX__-seed
    forjate.io/usecase: __NAME__
    forjate.io/phase: seed
spec:
  suspend: true
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: __PREFIX__-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "  Seeding __NAME__"
              # TODO: wait for your dependencies to accept connections, then
              # load the fixtures. Keep it idempotent — the runner re-runs this
              # Job on every `up`.
              echo "  [TODO] no fixtures defined yet"
              echo "  Seed complete."
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "200m" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
