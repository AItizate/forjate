name: Validate Kustomize

on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'docs/examples/**'
      - 'scripts/checks/**'
      - 'wiki/catalog.json'
      - '.github/workflows/validate-kustomize.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/checks/**'
      - 'wiki/catalog.json'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Install kubeconform
        run: |
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Stage placeholder secrets
        # Some overlays consume real .env files at build time via Kustomize's
        # secretGenerator (envs:). Those .env files are gitignored. We seed
        # them from their .env.example siblings so kustomize build can run
        # in CI. The values are placeholders — never deployed from CI.
        run: |
          set -euo pipefail
          while IFS= read -r ex; do
            real="${ex%.example}"
            if [ ! -f "$real" ]; then
              cp "$ex" "$real"
              echo "Seeded $real from $ex"
            fi
          done < <(find k8s -type f -name '*.env.example')

      - name: Discover targets
        id: discover
        run: |
          {
            # All overlays (recursively, but only dirs that contain a kustomization.yaml)
            find k8s/overlays -type f -name 'kustomization.yaml' -exec dirname {} \;
            # Every component directory with a kustomization.yaml, at any depth: tenants reference
            # sub-directories (variants, kustomize Components) by path on their own
            find k8s/components -type f -name 'kustomization.yaml' -exec dirname {} \;
            # The base every tenant inherits, as a remote tenant pulls it
            echo k8s/base
            # Example tenant overlays that the docs tell people to copy: if the guide
            # drifts from the components, this build is what fails.
            find docs/examples -type f -name 'kustomization.yaml' -exec dirname {} \;
          } | sort -u > /tmp/targets.txt
          echo "Targets to build:"
          cat /tmp/targets.txt
          echo "count=$(wc -l < /tmp/targets.txt)" >> "$GITHUB_OUTPUT"

      - name: Build + validate each target
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r target; do
            echo "::group::Build $target"
            if ! kustomize build --enable-helm "$target" > /tmp/manifest.yaml 2> /tmp/build.err; then
              echo "::error file=$target/kustomization.yaml::kustomize build failed"
              cat /tmp/build.err
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "Manifest size: $(wc -l < /tmp/manifest.yaml) lines"
            if ! kubeconform \
                -strict \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -summary \
                /tmp/manifest.yaml; then
              echo "::error file=$target/kustomization.yaml::kubeconform validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < /tmp/targets.txt
          exit "$fail"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the repo-wide checks' dependencies
        run: python3 -m pip install --quiet pyyaml pytest

      - name: Repo-wide checks' own tests
        run: python3 -m pytest -q scripts/checks/tests

      - name: Object-store coupling (ratchet against scripts/checks/object-store-coupling.baseline)
        # No component outside the object-store providers names one (Service, label, Secret, image) or carries
        # a literal S3 credential; consumers read the S3 contract (docs/tenant-onboarding/configuring-object-storage.md).
        run: scripts/checks/object-store-coupling-check.sh

      - name: Object-store contract
        # Every wiring.consumes declaration in the catalog reads only the keys of its capability's contract.
        run: scripts/checks/object-store-contract-check.sh

      - name: Pins over base and components (ratchet against scripts/checks/pin.baseline)
        # Remote resources on a tag or commit, helmCharts at an exact version, no untagged or latest image.
        run: scripts/checks/pin-check.sh

      - name: Plaintext-credential scan
        # The security expert's gate (secret-scan): configMapGenerator literals, configs/,
        # env patches and tracked .env files. A real tenant leaked two LLM API keys next to
        # 24 correctly sealed secrets; this is what would have caught them.
        run: python3 plugins/forjate/scripts/builder/secret-scan.py k8s/overlays k8s/components k8s/base

      - name: Summary
        if: always()
        run: |
          echo "Validated ${{ steps.discover.outputs.count }} targets."
