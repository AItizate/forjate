name: Validate Use Cases

# Gates for the ephemeral use-case pattern (docs/ephemeral-use-cases.md).
# The overlay manifests themselves are covered by validate-kustomize.yml,
# which discovers k8s/overlays recursively. What is validated here is the
# contract, the runner, and the lifecycle those two implement together.
#
# Nothing below names a use case. `plan` lists the ones a change affects
# (scripts/ephemeral/affected.py follows each overlay's references through the
# tree) and every one of them runs end to end, each on its own runner.

on:
  pull_request:
    paths:
      # Broad on purpose: a use case can compose anything in k8s/ or run any
      # script. `plan` narrows it down, and an empty plan starts no cluster.
      - 'k8s/**'
      - 'scripts/**'
      - '.ait/templates/usecase/**'
      - '.github/workflows/validate-usecases.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - '.ait/templates/usecase/**'
      - '.github/workflows/validate-usecases.yml'
  # Every use case, the runner included: before tagging a release, for one.
  workflow_dispatch:

env:
  KUSTOMIZE_VERSION: 5.8.3
  K3D_VERSION: 5.9.0
  YQ_VERSION: 4.44.3

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      usecases: ${{ steps.plan.outputs.usecases }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff against the PR base needs history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Affected use cases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A pull request runs what it affects; main and a manual run, everything.
          if [ "$EVENT" = "pull_request" ]; then
            plan="$(python scripts/ephemeral/affected.py --base "$BASE")"
          else
            plan="$(python scripts/ephemeral/affected.py --all)"
          fi
          echo "$plan"
          echo "usecases=$(jq -c .usecases <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "runner=$(jq -r .runner <<< "$plan")" >> "$GITHUB_OUTPUT"

  lint-contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          # A pinned release by direct URL: install_kustomize.sh asks the GitHub API
          # for the latest one and fails when the runner is rate-limited.
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          pipx install check-jsonschema

      - name: Stage placeholder secrets
        # Overlays consume gitignored .env files through secretGenerator. Seed
        # them from their committed examples so the manifests can be built,
        # exactly as validate-kustomize.yml does.
        run: |
          set -euo pipefail
          find k8s/overlays/usecases -type f -name '*.env.example' | while IFS= read -r ex; do
            real="${ex%.example}"
            [ -f "$real" ] || cp "$ex" "$real"
          done

      - name: Validate contracts against the schema
        run: |
          set -euo pipefail
          shopt -s nullglob
          contracts=(k8s/overlays/usecases/*/usecase.yaml)
          if [ ${#contracts[@]} -eq 0 ]; then
            echo "No use cases found — nothing to validate."
            exit 0
          fi
          echo "Validating ${#contracts[@]} contract(s) against usecase.schema.json"
          check-jsonschema --schemafile scripts/ephemeral/usecase.schema.json "${contracts[@]}"

      - name: Assert contract matches its overlay
        # Two invariants the runner depends on and the schema cannot express:
        # the contract's identity must match its directory, and every Job it
        # names must actually exist in the built manifest.
        run: |
          set -euo pipefail
          fail=0
          for contract in k8s/overlays/usecases/*/usecase.yaml; do
            dir="$(dirname "$contract")"
            name="$(basename "$dir")"
            echo "::group::$name"

            declared="$(yq -r '.metadata.name' "$contract")"
            if [ "$declared" != "$name" ]; then
              echo "::error file=$contract::metadata.name is '$declared' but the directory is '$name'"
              fail=1
            fi

            # spec.files: repo paths the runner ships as ConfigMaps must exist.
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if [ -e "$path" ]; then
                echo "  file -> $path"
              else
                echo "::error file=$contract::spec.files path '$path' does not exist"
                fail=1
              fi
            done < <(yq -r '(.spec.files // [])[].paths[]' "$contract")

            kustomize build --enable-helm "$dir" > /tmp/manifest.yaml

            for phase in seed run verify; do
              job="$(yq -r ".spec.jobs.${phase}.name // \"\"" "$contract")"
              [ -n "$job" ] && [ "$job" != "null" ] || continue

              # `yq ea` collects every document into one stream before filtering,
              # then the array wrapper picks the single match. A bare
              # `select(...) | .x // default` behaves differently across yq 4.x
              # releases — older ones evaluate the alternative for non-matching
              # documents too, so the result is one answer per document.
              matches="$(yq ea -r "[select(.kind == \"Job\" and .metadata.name == \"$job\")] | length" \
                           /tmp/manifest.yaml)"
              if [ "$matches" -eq 0 ]; then
                echo "::error file=$contract::spec.jobs.${phase}.name '$job' has no matching Job in the built manifest"
                fail=1
                continue
              fi

              # Lifecycle Jobs must ship suspended so that applying the overlay
              # does not start all three at once, racing the runner's ordering.
              suspended="$(yq ea -r "[select(.kind == \"Job\" and .metadata.name == \"$job\")] | .[0].spec.suspend // false" \
                             /tmp/manifest.yaml)"
              if [ "$suspended" != "true" ]; then
                echo "::error file=$contract::Job '$job' must set spec.suspend: true"
                fail=1
              else
                echo "  $phase -> $job (suspended)"
              fi
            done
            echo "::endgroup::"
          done
          exit "$fail"

  shellcheck:
    name: Runner scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        # The runner, the scaffolder, every script a use case carries and every
        # script a contract ships through spec.files. Each file's shebang (or
        # `# shellcheck shell=`) says whether it is bash or POSIX sh.
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          sudo curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          {
            git ls-files 'scripts/ephemeral/*.sh' 'k8s/overlays/usecases/*.sh'
            for contract in k8s/overlays/usecases/*/usecase.yaml; do
              yq -r '(.spec.files // [])[].paths[]' "$contract" | while IFS= read -r listed; do
                git ls-files "$listed" | grep '\.sh$' || true
              done
            done
          } | sort -u > /tmp/scripts.txt
          cat /tmp/scripts.txt
          xargs shellcheck --external-sources --source-path=SCRIPTDIR < /tmp/scripts.txt

  runner:
    name: Runner lifecycle
    needs: plan
    if: needs.plan.outputs.runner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The runner proven on what the scaffolder generates, not on a committed
    # example: up, ls, idempotent up, gc of an expired environment, down.
    env:
      PROBE: ci-runner-probe
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: &install |
          # Pinned releases by direct URL: the install scripts ask the GitHub API
          # for the latest one and fail when the runner is rate-limited.
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="v${K3D_VERSION}" bash
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          sudo curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          k3d version && yq --version

      - name: Scaffold a use case
        run: ./scripts/ephemeral/create-usecase.sh --name "$PROBE" --ttl 1h --prefix probe

      - name: Bring it up
        run: ./scripts/ephemeral/ephemeral.sh up "$PROBE"

      - name: List live environments
        run: ./scripts/ephemeral/ephemeral.sh ls

      - name: Re-running up is idempotent
        run: ./scripts/ephemeral/ephemeral.sh up "$PROBE"

      - name: Expired environments are reclaimed
        run: |
          set -euo pipefail
          export KUBECONFIG="${HOME}/.kube/forjate-uc-shared.yaml"
          kubectl annotate ns "uc-${PROBE}" \
            forjate.io/expires-at=2020-01-01T00:00:00Z --overwrite
          ./scripts/ephemeral/ephemeral.sh gc --dry-run
          ./scripts/ephemeral/ephemeral.sh gc
          if kubectl get ns "uc-${PROBE}" >/dev/null 2>&1; then
            echo "::error::gc did not reclaim the expired namespace"
            exit 1
          fi
          echo "Expired namespace reclaimed."

      - name: Diagnostics on failure
        if: failure()
        run: ./scripts/ephemeral/ephemeral.sh diagnose "$PROBE" || true

      - name: Tear down
        if: always()
        run: ./scripts/ephemeral/ephemeral.sh down "$PROBE" || true

  e2e:
    name: Use case ${{ matrix.usecase }}
    needs: plan
    if: needs.plan.outputs.usecases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        usecase: ${{ fromJSON(needs.plan.outputs.usecases) }}
    env:
      # Through the environment, never interpolated into a script.
      UC: ${{ matrix.usecase }}
    # Each use case on its own runner, so `dedicated` and `shared` ones never
    # meet. Verify exits 0 only if every claim the use case makes holds. The
    # Job logs are public: use-case Jobs must never print a token, key or password.
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: *install

      - name: Up (seed, run, verify)
        run: ./scripts/ephemeral/ephemeral.sh up "$UC"

      - name: Diagnostics on failure
        if: failure()
        run: ./scripts/ephemeral/ephemeral.sh diagnose "$UC" || true

      - name: Tear down
        if: always()
        run: ./scripts/ephemeral/ephemeral.sh down "$UC" || true
