name: Validate Zitadel

# The zitadel component renders Helm output and ships a reconciler script. This gate
# runs what no other workflow does: the Argo CD hook/sync-wave semantics of the render,
# the tenant contract (Secret names and keys against the rendered pods and the docs),
# and bootstrap.py against a mocked Zitadel and Secrets API (idempotency,
# create-or-update, exit codes). The example overlay itself is built by
# validate-kustomize.yml.

on:
  pull_request:
    paths:
      - 'k8s/components/apps/auth/zitadel/**'
      - 'k8s/components/bundles/zitadel-stack/**'
      - 'k8s/components/apps/databases/postgres/**'
      - 'docs/examples/zitadel-tenant/**'
      - 'docs/apps/zitadel.md'
      - 'tests/zitadel/**'
      - '.github/workflows/validate-zitadel.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/components/apps/auth/zitadel/**'
      - 'k8s/components/bundles/zitadel-stack/**'
      - 'docs/examples/zitadel-tenant/**'
      - 'tests/zitadel/**'

jobs:
  zitadel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
          helm version

      - name: Install poetry and dependencies
        run: |
          pipx install poetry
          poetry install --no-root

      - name: Render, contract and bootstrap tests
        run: poetry run pytest tests/zitadel -v
