# oauth2-proxy values for Zitadel OIDC integration
#
# Copy this file to your overlay directory and customize:
#   cp oauth2-values-zitadel.yaml <your overlay>/oauth2-values.yaml
#
# Then update:
#   1. oidc-issuer-url → https://zitadel.{your-domain}
#   2. redirect-url → https://auth.{your-domain}/oauth2/callback
#   3. cookie-domain → .{your-domain}
#   4. whitelist-domain → .{your-domain}
#   5. The Secret zitadel-oidc-oauth2-proxy must exist in oauth2-proxy's namespace.
#      The bootstrap writes it in ITS OWN namespace (the Zitadel one), keys client-id,
#      client-secret, issuer-url, for the application named `oauth2-proxy` in its
#      config. Copy it across (SealedSecret / ESO / reflector) or run both in one namespace.

replicaCount: 1

extraArgs:
  # --- OIDC Provider (Zitadel) ---
  provider: oidc
  oidc-issuer-url: https://zitadel.example.com
  # client-id and client-secret: use env vars from secret (see extraEnv below)

  # --- OIDC Claims for RBAC ---
  # Zitadel emits roles as an OBJECT under urn:zitadel:iam:org:project:roles, which
  # oauth2-proxy cannot read as groups. Define the `groupsClaim` action (commented
  # example in the bootstrap ConfigMap) so a flat `groups` claim exists.
  oidc-groups-claim: groups
  allowed-group: admin,operator,viewer

  # --- URLs ---
  http-address: 0.0.0.0:4180
  redirect-url: https://auth.example.com/oauth2/callback
  upstream: "static://200"

  # --- Cookie ---
  cookie-secure: true
  cookie-samesite: lax
  cookie-path: /
  cookie-domain: .example.com
  cookie-csrf-per-request: true
  cookie-refresh: 8h
  cookie-expire: 48h

  # --- Access Control ---
  email-domain: "*"
  whitelist-domain: .example.com
  reverse-proxy: true
  proxy-prefix: /oauth2

  # --- Headers (pass user info to apps) ---
  pass-authorization-header: true
  pass-access-token: true
  pass-user-headers: true
  set-authorization-header: true
  set-xauthrequest: true
  pass-host-header: true
  real-client-ip-header: X-Real-IP

  # --- UX ---
  skip-provider-button: true
  # TLS to Zitadel is verified (ssl-insecure-skip-verify is NOT set). If your issuer
  # uses a private CA, mount it and set `ssl-cert-file`/SSL_CERT_FILE instead.
  code-challenge-method: S256

  # --- Logging ---
  request-logging: true
  auth-logging: true
  standard-logging: true

# Read OIDC credentials from the secret created by Zitadel bootstrap
extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: zitadel-oidc-oauth2-proxy
        key: client-id
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: zitadel-oidc-oauth2-proxy
        key: client-secret
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name: oauth2-proxy-cookie
        key: cookie-secret

service:
  type: ClusterIP
  portNumber: 80
ingress:
  enabled: false
