apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  # Postgres is opt-in. Overlays that need DB-backed admin features (key
  # management, model store, request logs) add it explicitly:
  #   - ../../../components/apps/ai-models/litellm/postgres
  # The quickstart runs without it (STORE_MODEL_IN_DB=False), keeping the
  # deploy zero-DB and zero-secrets-from-the-user.
  # - secret.yaml # Should be in overlays/[tenant/env]/secrets/litellm.env
