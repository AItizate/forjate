apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    argocd.argoproj.io/sync-wave: "3"
spec:
  rules:
    - host: zitadel.example.com
      http:
        paths:
          # Login V2 is a separate service; everything else (API, Console, OIDC, the
          # IdP callback /idps/callback) is Zitadel itself.
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
  tls:
    - hosts:
        - zitadel.example.com
      secretName: zitadel-tls
