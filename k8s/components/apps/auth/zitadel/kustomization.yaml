apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Zitadel — Cloud-native Identity Provider with built-in user management
#
# Replaces GoTrue and complements oauth2-proxy as the OIDC provider.
# Provides what oauth2-proxy lacks: user creation, RBAC, service accounts.
#
# Architecture:
#   Zitadel (IdP + user DB + RBAC)
#     ↓ OIDC
#   oauth2-proxy (Traefik middleware, unchanged)
#     ↓ ForwardAuth
#   Protected apps
#
# oauth2-proxy changes only its provider config:
#   provider: google → provider: oidc + oidc-issuer-url: https://zitadel.{domain}
#
# Zitadel concepts mapped to the factory:
#   Organization  → Tenant (multi-org support for internal + external users)
#   Project       → App group (ai-tools, monitoring, productivity)
#   Application   → OIDC client (oauth2-proxy, open-webui, n8n)
#   Role          → Access level (admin, viewer, operator)
#   Service User  → Machine account (agents, pipelines, CI/CD)
#
# Zitadel uses Helm chart via Kustomize helmCharts generator.
# PostgreSQL uses the factory's own postgres component (not Bitnami Helm).
# Requires: kustomize with --enable-helm flag
#
# Usage:
#   kubectl kustomize --enable-helm k8s/components/apps/auth/zitadel
#
# Dependencies (must be included in tenant overlay or use the zitadel-stack bundle):
#   - k8s/components/apps/databases/postgres (with namePrefix: zitadel-)
#
# Tenant must provide:
#   - A namespace (set via kustomization `namespace:` field)
#   - Secret "zitadel-postgres-secret" with: POSTGRES_USER=zitadel, POSTGRES_PASSWORD, POSTGRES_DB=zitadel
#   - Secret "zitadel-masterkey" with key "masterkey" (32-char encryption key)
#   - Secret "zitadel-db-config" with key "config-yaml" containing FULL DB config:
#       Database:
#         postgres:
#           Host: zitadel-postgres
#           Port: 5432
#           Database: zitadel
#           User:
#             Username: zitadel
#             Password: <same as POSTGRES_PASSWORD>
#             SSL:
#               Mode: disable
#           Admin:
#             ExistingDatabase: zitadel
#             Username: zitadel
#             Password: <same as POSTGRES_PASSWORD>
#             SSL:
#               Mode: disable
#     (configSecretName overrides configmapConfig — include everything, not just passwords)
#   - Patch for ingress hostname (zitadel.example.com → zitadel.{tenant-domain})
#   - Patch for oauth2-proxy to use Zitadel as OIDC provider
#   - Patch for clusterrolebinding subject namespace (rbac/clusterrolebinding.yaml)

# Namespace is NOT set here — the consumer overlay sets it.
# This allows deploying Zitadel into any namespace (auth, identity, zitadel, etc.)
#
# All resources (Helm + kustomize) share the label:
#   app.kubernetes.io/part-of: zitadel
#
# Consumer overlay example:
#   namespace: auth
#   resources:
#     - ../../../../components/apps/auth/zitadel

resources:
  - ingress.yaml

helmCharts:
  - name: zitadel
    repo: https://charts.zitadel.com
    version: 8.12.2
    releaseName: zitadel
    # namespace: set by consumer overlay via kustomization namespace field
    valuesInline:
      zitadel:
        # masterkey read from K8s secret named "zitadel-masterkey" (key: "masterkey")
        # Create: kubectl create secret generic zitadel-masterkey --from-literal=masterkey=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32)
        masterkey: ""
        masterkeySecretName: zitadel-masterkey
        # DB passwords come from a consumer-provided secret
        configSecretName: zitadel-db-config
        configSecretKey: config-yaml
        configmapConfig:
          ExternalSecure: true
          ExternalDomain: zitadel.example.com
          ExternalPort: 443
          TLS:
            Enabled: false
          Database:
            postgres:
              Host: zitadel-postgres  # factory component with namePrefix zitadel-
              Port: 5432
              Database: zitadel
              User:
                Username: zitadel
                SSL:
                  Mode: disable
              Admin:
                # factory component creates POSTGRES_USER as superuser and POSTGRES_DB already
                # so init connects to the existing zitadel DB, no need to create anything
                ExistingDatabase: zitadel
                Username: zitadel
                SSL:
                  Mode: disable
          DefaultInstance:
            Org:
              Human:
                UserName: admin
                FirstName: Admin
                LastName: User
                Email:
                  Address: admin@example.com
                  Verified: true
                Password: ""  # patched by overlay secret
          Machine:
            MachineKeyLifetime: 8760h  # 1 year for service accounts
      # Helm hooks -> Argo CD hooks.
      #
      # The chart ships init/setup as `helm.sh/hook: pre-install,pre-upgrade`. Argo CD
      # maps those to PreSync, which runs BEFORE the postgres StatefulSet exists, so
      # init would wait for a database that the same sync has not created yet.
      # Blanking the annotation does not help either: Argo CD (gitops-engine
      # pkg/sync/hook/helm/hook.go, v3.6.1) treats any object that carries the
      # `helm.sh/hook` KEY as a hook, whatever its value, and then finds no phase, so
      # the Job is neither synced nor run.
      #
      # So every `helm.sh/hook*` key is deleted by the patch at the bottom of this
      # file (Helm values cannot delete a chart default annotation through the
      # kustomize inflator) and the Jobs become Argo CD Sync hooks ordered with
      # sync-waves:
      #   wave 0  postgres, ServiceAccount, ConfigMap, Role   (plain resources)
      #   wave 1  zitadel-init  (hook, Sync, recreated on each sync)
      #   wave 2  zitadel-setup (hook, Sync, recreated on each sync)
      #   wave 3  zitadel Deployment + Ingress
      # The hooks are recreated (BeforeHookCreation) instead of patched, so a chart
      # bump that changes the Job template never hits "field is immutable".
      # tests/zitadel/test_render.py asserts this on the rendered output.
      #
      # The init containers wait for postgres: the pod can start before the
      # StatefulSet pod is ready even inside wave ordering.
      # ZITADEL_PG_HOST must match Database.postgres.Host above.
      # If using an external postgres, override both in the consumer overlay.
      initJob:
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          argocd.argoproj.io/sync-wave: "1"
        initContainers:
          - name: wait-for-postgres
            image: busybox:1.36
            env:
              - name: ZITADEL_PG_HOST
                value: zitadel-postgres
              - name: ZITADEL_PG_PORT
                value: "5432"
            command: ['sh', '-c', 'until nc -z $ZITADEL_PG_HOST $ZITADEL_PG_PORT; do echo "waiting for $ZITADEL_PG_HOST:$ZITADEL_PG_PORT..."; sleep 2; done']
      setupJob:
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
          argocd.argoproj.io/sync-wave: "2"
        initContainers:
          - name: wait-for-postgres
            image: busybox:1.36
            env:
              - name: ZITADEL_PG_HOST
                value: zitadel-postgres
              - name: ZITADEL_PG_PORT
                value: "5432"
            command: ['sh', '-c', 'until nc -z $ZITADEL_PG_HOST $ZITADEL_PG_PORT; do echo "waiting for $ZITADEL_PG_HOST:$ZITADEL_PG_PORT..."; sleep 2; done']
      # Starts only after setup has migrated the database.
      annotations:
        argocd.argoproj.io/sync-wave: "3"
      commonLabels:
        app.kubernetes.io/part-of: zitadel
      replicaCount: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi


# The chart hooks the ServiceAccount, the config ConfigMap and both Jobs with
# helm.sh/hook*. Argo CD treats the mere presence of the key as "this is a hook"
# (see the comment on initJob), so the keys are DELETED, never blanked. The
# annotationSelector matches exactly the objects that carry the key.
patches:
  - target:
      annotationSelector: helm.sh/hook
    patch: |
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight

labels:
  - pairs:
      app.kubernetes.io/part-of: zitadel
