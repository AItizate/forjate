# Keypair of the Login V2 service (Deployment zitadel-login). Zitadel verifies the
# JWTs the login signs with the public half (SystemAPIUsers, tls.crt); the login
# signs with tls.key. The chart can render this Secret itself, but its template draws
# a NEW random keypair on every build (lookup is empty outside the cluster), which
# means a permanent OutOfSync under Argo CD, so cert-manager owns it instead and the
# chart only references it (login.loginServiceKeySecretName).
#
# rotationPolicy: Never keeps the private key across renewals; a 10 year certificate
# never expires in practice. Zitadel reads tls.crt at start, so after a renewal restart
# the zitadel and zitadel-login Deployments.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zitadel-login-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zitadel-login-service-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: zitadel-login-service-key
  commonName: login-service
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  usages:
    - digital signature
  issuerRef:
    name: zitadel-login-selfsigned
    kind: Issuer
