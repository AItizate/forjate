apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zitadel-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zitadel-bootstrap
subjects:
  - kind: ServiceAccount
    name: zitadel-bootstrap
    namespace: auth  # Override this in your overlay to match your Zitadel namespace
