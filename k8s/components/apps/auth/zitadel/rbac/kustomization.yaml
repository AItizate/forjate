apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Zitadel RBAC — Kubernetes RBAC for bootstrap Job
#
# Grants the bootstrap Job permission to create/update secrets
# in the security namespace (for storing OIDC client credentials).

resources:
  - clusterrole.yaml
  - clusterrolebinding.yaml

labels:
  - pairs:
      app.kubernetes.io/ait-component: zitadel-rbac
