# Opt-in backend: back up to an external S3-compatible store (AWS S3, R2, B2, ...).
# Use it in place of values-minio-backend.yaml (see README, "Switching backend").
# Replace bucket, region and s3Url for your provider; for AWS S3 itself drop s3Url
# and s3ForcePathStyle. Credentials: Secret `velero-credentials`, key `cloud`.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.1
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: CHANGE-ME-velero-backups
      default: true
      config:
        region: CHANGE-ME-region
        s3ForcePathStyle: "true"
        s3Url: https://CHANGE-ME-s3-endpoint
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: CHANGE-ME-region
  features: EnableCSI

credentials:
  useSecret: true
  existingSecret: velero-credentials

snapshotsEnabled: true
deployNodeAgent: true
