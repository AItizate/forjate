apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set the namespace for all resources
namespace: argocd

# This file is used to deploy ArgoCD in a Kubernetes cluster.
# It references the official ArgoCD installation manifests, pinned to a release tag
# (never the moving `stable` branch). Bump the tag deliberately, in its own PR.
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
  - namespace.yaml
  - certificate.yaml
  - ingress.yaml
