# External Secrets reads OpenBao's kv-v2 mount through this store, logging in with
# its own ServiceAccount (auth/kubernetes role external-secrets, policy
# external-secrets: read kv/data/workloads/* and nothing else).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.security.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
