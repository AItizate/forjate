# A bucket owned by the consumer's namespace. The bucket name in S3 is metadata.name.
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: my-app-data
  namespace: my-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
