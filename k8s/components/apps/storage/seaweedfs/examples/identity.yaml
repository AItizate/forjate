# An IAM user and its key pair. The operator generates the keys and writes them to
# the Secret `my-app-s3` in this namespace, under the AWS SDK standard names, so a
# consumer mounts it with envFrom. No credential is ever committed.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: my-app
  namespace: my-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: my-app
  namespace: my-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: my-app
  secretRef:
    name: my-app-s3
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
