# Read/write on one bucket, bound to one identity. Any other bucket is denied.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: my-app-data-rw
  namespace: my-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  statements:
    - effect: Allow
      actions: [s3:ListBucket, s3:GetBucketLocation]
      resources: [my-app-data]
    - effect: Allow
      actions: [s3:GetObject, s3:PutObject, s3:DeleteObject]
      resources: [my-app-data/*]
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: my-app-data-rw
  namespace: my-app
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  policyRef:
    name: my-app-data-rw
  subjects:
    - kind: S3Identity
      name: my-app
