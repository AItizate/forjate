# Lets namespaces labelled forjate.io/object-store-client: "true" (the same label the
# NetworkPolicy reads) declare buckets, identities and policies against this cluster.
# Without a grant, cross-namespace references stay Pending. Lives in the cluster's namespace.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: object-store-clients
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespaceSelector: &clients
        matchLabels:
          forjate.io/object-store-client: "true"
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespaceSelector: *clients
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespaceSelector: *clients
    - group: seaweed.seaweedfs.com
      kind: S3Policy
      namespaceSelector: *clients
    - group: seaweed.seaweedfs.com
      kind: S3PolicyBinding
      namespaceSelector: *clients
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweedfs
