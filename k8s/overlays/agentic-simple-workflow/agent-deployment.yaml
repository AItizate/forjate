# Reference agent Deployment. Replace the image with your own and adapt env vars
# and the secret reference (agent-secrets) to whatever your agent needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent
  labels:
    app: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/example/agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres.agent.svc.cluster.local:5432/agent
            - name: OBJECT_STORE_ENDPOINT
              value: http://minio.agent.svc.cluster.local:9000
            - name: LLM_BASE_URL
              value: http://ollama.agent.svc.cluster.local:11434
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent
spec:
  selector:
    app: agent
  ports:
    - port: 80
      targetPort: 8080
      name: http
