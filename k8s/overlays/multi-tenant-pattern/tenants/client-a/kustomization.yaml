# k8s/overlays/multi-tenant-pattern/tenants/client-a/kustomization.yaml
#
# Per-client overlay. Extends the org overlay (../../org) and applies only
# what is specific to this tenant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../org
  - ./namespace.yaml

labels:
  - pairs:
      tenant: client-a

