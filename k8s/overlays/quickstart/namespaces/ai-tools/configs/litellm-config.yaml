model_list:
  - model_name: "gemma"
    litellm_params:
      model: "ollama/gemma4:e2b-it-q4_K_M"
      api_base: "http://ollama-service.ai-tools.svc.cluster.local:11434"

  - model_name: "gemma3"
    litellm_params:
      model: "ollama/gemma3:1b"
      api_base: "http://ollama-service.ai-tools.svc.cluster.local:11434"

litellm_settings:
  drop_params: true

# Demo key — k3d ClusterIP-only cluster, no external reach. Real tenants seal real secrets.
# Must live HERE (general_settings.master_key) and not in LITELLM_MASTER_KEY env var,
# otherwise LiteLLM falls back to DB virtual-key lookup and 401s every external request.
general_settings:
  master_key: "sk-quickstart-localdev-only"
