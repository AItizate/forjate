# Post-deploy validation Job for the `quickstart` overlay.
# Validates the LiteLLM → Ollama pipeline end-to-end from inside the cluster:
#   1. litellm responds to /health/liveliness.
#   2. /v1/models lists the expected model alias.
#   3. /v1/chat/completions returns a non-empty assistant message for a known
#      prompt (LiteLLM routes this to the Ollama backend behind the scenes).
# Exits non-zero on any failure.
apiVersion: batch/v1
kind: Job
metadata:
  name: quickstart-validate
  namespace: ai-tools
  labels:
    app: quickstart-validate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: quickstart-validate
    spec:
      restartPolicy: Never
      containers:
        - name: validate
          # curl image ships curl + busybox. No jq — responses are parsed with sed.
          image: curlimages/curl:8.10.1
          env:
            - name: LITELLM_URL
              value: "http://litellm.ai-tools.svc.cluster.local:4000"
            - name: LITELLM_MODEL
              # Default matches the default OLLAMA_MODEL (gemma4:e2b-it-q4_K_M).
              # 02_deploy.sh patches this on the fly when OLLAMA_MODEL is overridden.
              value: "gemma"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY
            - name: PROMPT
              value: "Reply with exactly: hello from forjate"
            - name: GENERATE_TIMEOUT
              value: "600"
          command: ["sh", "-c"]
          args:
            - |
              set -e
              PASS=0
              FAIL=0
              check() {
                local name="$1"; shift
                if "$@" >/dev/null 2>&1; then
                  echo "  [PASS] $name"
                  PASS=$((PASS+1))
                else
                  echo "  [FAIL] $name"
                  FAIL=$((FAIL+1))
                fi
              }

              echo ""
              echo "===================================================="
              echo "  quickstart — LiteLLM (${LITELLM_MODEL}) -> Ollama validation"
              echo "===================================================="
              echo ""

              echo "1. LiteLLM health"
              check "litellm /health/liveliness responds" \
                curl -sf --max-time 10 "${LITELLM_URL}/health/liveliness"

              echo ""
              echo "2. Model registered"
              MODELS=$(curl -sf --max-time 10 \
                -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
                "${LITELLM_URL}/v1/models" || echo "")
              if echo "$MODELS" | grep -q "\"id\":\"${LITELLM_MODEL}\""; then
                echo "  [PASS] ${LITELLM_MODEL} present in /v1/models"
                PASS=$((PASS+1))
              else
                echo "  [FAIL] ${LITELLM_MODEL} NOT present in /v1/models"
                echo "         /v1/models returned: $MODELS"
                FAIL=$((FAIL+1))
              fi

              echo ""
              echo "3. Chat completion round-trip (timeout: ${GENERATE_TIMEOUT}s)"
              PAYLOAD="{\"model\":\"${LITELLM_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"${PROMPT}\"}]}"
              RESP=$(curl -sf --max-time "${GENERATE_TIMEOUT}" \
                       -H "Content-Type: application/json" \
                       -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
                       -d "${PAYLOAD}" \
                       "${LITELLM_URL}/v1/chat/completions" || echo "")
              # Extract the first choice's message.content with sed (no jq).
              # Response shape: {..."choices":[{"index":0,"message":{"role":"assistant","content":"..."}, ...}], ...}
              REPLY=$(echo "$RESP" | sed -n 's/.*"content":"\([^"]*\)".*/\1/p' | head -1)
              if [ -n "$REPLY" ]; then
                echo "  [PASS] model replied: $(echo "$REPLY" | head -c 200)"
                PASS=$((PASS+1))
              else
                echo "  [FAIL] empty or missing content"
                echo "         /v1/chat/completions returned: $(echo "$RESP" | head -c 400)"
                FAIL=$((FAIL+1))
              fi

              echo ""
              echo "===================================================="
              echo "  $PASS passed, $FAIL failed"
              echo "===================================================="
              [ "$FAIL" -eq 0 ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
