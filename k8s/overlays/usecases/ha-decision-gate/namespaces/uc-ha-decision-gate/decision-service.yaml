# The decision engine slot, as a long-lived Deployment rather than a Job step.
#
# It outlives the lifecycle Jobs on purpose: `spec.outputs` advertises it, so
# once `up` returns, an agent — or a Home Assistant automation — can keep asking
# it for decisions for the rest of the TTL. That is the difference between a test
# fixture and an environment.
#
# The server is standard-library Python mounted from a ConfigMap. No image to
# build, nothing installed at runtime, so the pod filesystem stays read-only and
# a cold `up` needs no registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  labels:
    app: decision-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decision-service
  template:
    metadata:
      labels:
        app: decision-service
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "-u", "/app/decision_service.py"]
          ports:
            - containerPort: 8080
          env:
            # Swapping the engine is this block and nothing else. A purpose-built
            # decision model registers a backend in decision_service.py and
            # changes ENGINE; the API, the Jobs and the contract do not move.
            - name: ENGINE
              valueFrom:
                configMapKeyRef: { name: hadg-engine-config, key: ENGINE }
            - name: ENGINE_BASE_URL
              valueFrom:
                configMapKeyRef: { name: hadg-engine-config, key: ENGINE_BASE_URL }
            - name: ENGINE_MODEL
              valueFrom:
                configMapKeyRef: { name: hadg-engine-config, key: ENGINE_MODEL }
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: engine
              mountPath: /app
            # The default question schema, so a caller that posts only a state
            # still gets a full set of answers.
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: engine
          configMap:
            name: hadg-engine
        - name: data
          configMap:
            name: hadg-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  labels:
    app: decision-service
spec:
  type: ClusterIP
  selector:
    app: decision-service
  ports:
    - port: 8080
      targetPort: 8080
