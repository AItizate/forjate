    - k8s/overlays/usecases/invoice-intake/.builder/decisions/architecture.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/ai-engineering.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/data-pipeline.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/data-store.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/security.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/compliance.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/devops.yaml
    - k8s/overlays/usecases/invoice-intake/.builder/decisions/quality.yaml
