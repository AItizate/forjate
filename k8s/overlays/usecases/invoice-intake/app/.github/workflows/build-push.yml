# Enters at Walk (devops record); Crawl builds through ephemeral.sh spec.build. The template builds, scans with Trivy and pushes.
# Repository variables to set: IAC_REPOSITORY (<org>/<iac-repo>) and TENANT. The registry owner is the repository's; devops Q9 may replace ghcr.io.
name: Build, scan, push and write back
on:
  push:
    branches: [main]
jobs:
  build-scan-push:
    uses: AItizate/gh-actions-templates/.github/workflows/build-push-generic-template.yml@v1
    with:
      branch: ${{ github.ref_name }}
      registry_url: ghcr.io
      repository_name: ${{ github.repository_owner }}/invoice-intake
      image_tag: ${{ github.sha }}
      docker_file: ./Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}
  write-back:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch app-image-updated to the IaC repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.IAC_FACTORY_TOKEN }}
          repository: ${{ vars.IAC_REPOSITORY }}
          event-type: app-image-updated
          client-payload: '{"app_name": "invoice-intake", "new_tag": "${{ github.sha }}", "tenant": "${{ vars.TENANT }}", "namespace": "uc-invoice-intake"}'
  notify-on-failure:
    needs: [build-scan-push, write-back]
    if: always() && contains(needs.*.result, 'failure')
    uses: AItizate/gh-actions-templates/.github/workflows/webhook-notification-template.yml@v1
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      run_id: ${{ github.run_id }}
      server_url: ${{ github.server_url }}
    secrets:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
