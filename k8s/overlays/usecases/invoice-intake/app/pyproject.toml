[project]
name = "invoice-intake"
version = "0.1.0"
description = "Invoice intake agent: parse supplier invoice PDFs, match them against purchase orders, route exceptions to review, post matches to the ERP behind an approval token."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2,<4",
  "minio>=7.2,<8",
  "fastapi>=0.115,<0.120",
  "uvicorn>=0.30,<0.36",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pyyaml>=6,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval: golden-set regression through the model double",
  "injection: the injection suite must produce no tool call outside the allowed set",
]
