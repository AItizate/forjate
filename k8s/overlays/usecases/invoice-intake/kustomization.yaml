# Crawl root of invoice-intake, assembled from .builder/ by forjate:kustomize. Stages extend it: stages/walk, stages/run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base
- ./namespaces/uc-invoice-intake
labels:
- pairs:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/overlay: invoice-intake
