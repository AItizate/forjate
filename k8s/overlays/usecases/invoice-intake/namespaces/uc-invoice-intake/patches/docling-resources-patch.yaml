# Laptop sizing for apps/document-processing/docling (catalog defaults are sized for tenants).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
spec:
  template:
    spec:
      containers:
      - name: docling
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3Gi
