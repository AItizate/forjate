# shared-imap-mailbox-stub: a workload the architecture record names, served from the scaffold's image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-imap-mailbox-stub
  namespace: uc-invoice-intake
  labels: &id001
    app: shared-imap-mailbox-stub
    forjate.io/usecase: invoice-intake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-imap-mailbox-stub
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: shared-imap-mailbox-stub
        image: invoice-intake
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - invoice_intake.shared_imap_mailbox_stub
        env:
        - name: WORKLOAD
          value: shared-imap-mailbox-stub
        - name: DATA_CLASS
          value: financial
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: '5432'
        envFrom:
        - secretRef:
            name: postgres-secret
        - secretRef:
            name: double-admin-token
        - secretRef:
            name: mailbox-list-token
        - secretRef:
            name: mailbox-fetch-token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: writable-0
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthz
            port: 8001
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - containerPort: 8001
      volumes:
      - name: writable-0
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shared-imap-mailbox-stub
  namespace: uc-invoice-intake
  labels:
    app: shared-imap-mailbox-stub
    forjate.io/usecase: invoice-intake
spec:
  selector:
    app: shared-imap-mailbox-stub
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
