# run stage of invoice-intake: extends ../walk and adds what the records require for run, nothing the plan put out of scope.
# images: is the write-back surface: sync-app-image.yml (repository_dispatch app-image-updated) sets the SHA with yq, never sed.
# Every remote ref is a tag (ref-pinning-check); the Application tracks a tag with selfHeal (argocd-revision-check).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./relocated
- ../../../../../components/apps/security/external-secrets
- ../../../../../components/apps/security/openbao
- ./namespaces/uc-invoice-intake
- ./namespaces/uc-invoice-intake-baseline
- argocd/application.yaml
patches:
- path: patches/namespace-psa-patch.yaml
  target:
    kind: Namespace
    name: uc-invoice-intake
# Hand edit (data-store): the tenant credentials move to External Secrets with the rest; the admin secret lives only in the sibling namespace.
- target:
    kind: SealedSecret
    name: working-postgres-secret
    namespace: uc-invoice-intake
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n  name: working-postgres-secret\n"
- target:
    kind: SealedSecret
    name: episodic-postgres-secret
    namespace: uc-invoice-intake
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n  name: episodic-postgres-secret\n"
- target:
