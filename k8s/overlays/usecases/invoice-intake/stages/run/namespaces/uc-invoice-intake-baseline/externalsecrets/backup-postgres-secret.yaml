# Run: backup-postgres-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backup-postgres-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: backup-postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: PGUSER
    remoteRef:
      key: invoice-intake/backup-postgres-secret
      property: PGUSER
  - secretKey: PGPASSWORD
    remoteRef:
      key: invoice-intake/backup-postgres-secret
      property: PGPASSWORD
