# Run: formbricks-secret for apps/surveys/formbricks in uc-invoice-intake-baseline, pulled from the central store (security: secrets_mechanism external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: formbricks-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: formbricks-secret
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: DATABASE_URL
  - secretKey: NEXTAUTH_SECRET
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: NEXTAUTH_SECRET
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: ENCRYPTION_KEY
