# Run: gotrue-secret for apps/auth/gotrue-auth in uc-invoice-intake-baseline, pulled from the central store (security: secrets_mechanism external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gotrue-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: gotrue-secret
    creationPolicy: Owner
  data:
  - secretKey: GOTRUE_JWT_SECRET
    remoteRef:
      key: invoice-intake/gotrue-secret
      property: GOTRUE_JWT_SECRET
  - secretKey: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
    remoteRef:
      key: invoice-intake/gotrue-secret
      property: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
  - secretKey: GOTRUE_EXTERNAL_GOOGLE_SECRET
    remoteRef:
      key: invoice-intake/gotrue-secret
      property: GOTRUE_EXTERNAL_GOOGLE_SECRET
  - secretKey: DATABASE_URL
    remoteRef:
      key: invoice-intake/gotrue-secret
      property: DATABASE_URL
