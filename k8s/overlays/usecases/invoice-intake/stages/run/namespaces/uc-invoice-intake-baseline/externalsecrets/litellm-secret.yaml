# Run: litellm-secret for apps/ai-models/litellm in uc-invoice-intake-baseline, pulled from the central store (security: secrets_mechanism external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: litellm-secret
    creationPolicy: Owner
  data:
  - secretKey: LITELLM_MASTER_KEY
    remoteRef:
      key: invoice-intake/litellm-secret
      property: LITELLM_MASTER_KEY
