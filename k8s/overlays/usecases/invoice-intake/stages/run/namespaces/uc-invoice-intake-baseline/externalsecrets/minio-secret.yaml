# Run: minio-secret for apps/minio/dev in uc-invoice-intake-baseline, pulled from the central store (security: secrets_mechanism external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
  data:
  - secretKey: MINIO_ROOT_USER
    remoteRef:
      key: invoice-intake/minio-secret
      property: MINIO_ROOT_USER
  - secretKey: MINIO_ROOT_PASSWORD
    remoteRef:
      key: invoice-intake/minio-secret
      property: MINIO_ROOT_PASSWORD
