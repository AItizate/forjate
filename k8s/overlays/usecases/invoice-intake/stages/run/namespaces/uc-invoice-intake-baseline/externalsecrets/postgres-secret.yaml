# Run: postgres-secret for apps/databases/postgres in uc-invoice-intake-baseline, pulled from the central store (security: secrets_mechanism external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_DB
    remoteRef:
      key: invoice-intake/postgres-secret
      property: POSTGRES_DB
  - secretKey: POSTGRES_USER
    remoteRef:
      key: invoice-intake/postgres-secret
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: invoice-intake/postgres-secret
      property: POSTGRES_PASSWORD
