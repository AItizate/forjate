# Run: temporal-postgres-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-postgres-secret
  namespace: uc-invoice-intake-baseline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: temporal-postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: invoice-intake/temporal-postgres-secret
      property: POSTGRES_USER
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: invoice-intake/temporal-postgres-secret
      property: POSTGRES_PASSWORD
