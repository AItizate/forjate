# run: ExternalName aliases in uc-invoice-intake for the Services the PSA exceptions moved out (security: psa_exceptions).
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: uc-invoice-intake
  labels:
    forjate.io/psa-exception: uc-invoice-intake-baseline
spec:
  type: ExternalName
  externalName: vllm-service.uc-invoice-intake-baseline.svc.cluster.local
