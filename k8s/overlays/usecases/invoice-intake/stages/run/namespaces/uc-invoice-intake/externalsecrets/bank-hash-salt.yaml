# Run: bank-hash-salt pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-hash-salt
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: bank-hash-salt
    creationPolicy: Owner
  data:
  - secretKey: BANK_HASH_SALT
    remoteRef:
      key: invoice-intake/bank-hash-salt
      property: BANK_HASH_SALT
