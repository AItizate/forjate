# Run: double-admin-token pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: double-admin-token
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: double-admin-token
    creationPolicy: Owner
  data:
  - secretKey: DOUBLE_ADMIN_TOKEN
    remoteRef:
      key: invoice-intake/double-admin-token
      property: DOUBLE_ADMIN_TOKEN
