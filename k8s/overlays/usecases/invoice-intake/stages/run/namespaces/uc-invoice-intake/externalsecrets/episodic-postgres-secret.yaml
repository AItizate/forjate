# Run: episodic-postgres-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: episodic-postgres-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: episodic-postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: EPISODIC_DATABASE_URL
    remoteRef:
      key: invoice-intake/episodic-postgres-secret
      property: EPISODIC_DATABASE_URL
