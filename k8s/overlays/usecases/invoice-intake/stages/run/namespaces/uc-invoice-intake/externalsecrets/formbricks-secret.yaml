# Run: formbricks-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: formbricks-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: formbricks-secret
    creationPolicy: Owner
  data:
  - secretKey: NEXTAUTH_SECRET
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: NEXTAUTH_SECRET
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: ENCRYPTION_KEY
  - secretKey: CRON_SECRET
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: CRON_SECRET
  - secretKey: DATABASE_URL
    remoteRef:
      key: invoice-intake/formbricks-secret
      property: DATABASE_URL
