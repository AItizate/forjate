# Run: imap-mailbox-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: imap-mailbox-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: imap-mailbox-secret
    creationPolicy: Owner
  data:
  - secretKey: IMAP_MAILBOX_TOKEN
    remoteRef:
      key: invoice-intake/imap-mailbox-secret
      property: IMAP_MAILBOX_TOKEN
