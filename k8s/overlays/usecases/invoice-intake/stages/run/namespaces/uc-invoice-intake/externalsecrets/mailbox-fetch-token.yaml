# Run: mailbox-fetch-token pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mailbox-fetch-token
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: mailbox-fetch-token
    creationPolicy: Owner
  data:
  - secretKey: MAILBOX_FETCH_TOKEN
    remoteRef:
      key: invoice-intake/mailbox-fetch-token
      property: MAILBOX_FETCH_TOKEN
