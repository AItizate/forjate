# Run: minio-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
  data:
  - secretKey: MINIO_ROOT_USER
    remoteRef:
      key: invoice-intake/minio-secret
      property: MINIO_ROOT_USER
  - secretKey: MINIO_ROOT_PASSWORD
    remoteRef:
      key: invoice-intake/minio-secret
      property: MINIO_ROOT_PASSWORD
