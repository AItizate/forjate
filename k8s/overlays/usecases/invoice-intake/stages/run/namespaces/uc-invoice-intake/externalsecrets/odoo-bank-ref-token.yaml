# Run: odoo-bank-ref-token pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: odoo-bank-ref-token
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: odoo-bank-ref-token
    creationPolicy: Owner
  data:
  - secretKey: ODOO_BANK_REF_TOKEN
    remoteRef:
      key: invoice-intake/odoo-bank-ref-token
      property: ODOO_BANK_REF_TOKEN
