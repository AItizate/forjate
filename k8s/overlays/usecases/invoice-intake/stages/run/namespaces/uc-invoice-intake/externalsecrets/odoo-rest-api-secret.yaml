# Run: odoo-rest-api-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: odoo-rest-api-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: odoo-rest-api-secret
    creationPolicy: Owner
  data:
  - secretKey: ODOO_REST_API_TOKEN
    remoteRef:
      key: invoice-intake/odoo-rest-api-secret
      property: ODOO_REST_API_TOKEN
