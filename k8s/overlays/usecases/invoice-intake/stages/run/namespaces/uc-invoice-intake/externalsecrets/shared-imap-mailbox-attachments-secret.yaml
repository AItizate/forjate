# Run: shared-imap-mailbox-attachments-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shared-imap-mailbox-attachments-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: shared-imap-mailbox-attachments-secret
    creationPolicy: Owner
  data:
  - secretKey: SHARED_IMAP_MAILBOX_ATTACHMENTS_TOKEN
    remoteRef:
      key: invoice-intake/shared-imap-mailbox-attachments-secret
      property: SHARED_IMAP_MAILBOX_ATTACHMENTS_TOKEN
