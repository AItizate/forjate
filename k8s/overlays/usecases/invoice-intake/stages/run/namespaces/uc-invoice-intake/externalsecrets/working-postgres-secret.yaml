# Run: working-postgres-secret pulled from the central store (security: secrets_mechanism external-secrets); the SealedSecret of the same name is deleted above.
# ClusterSecretStore corporate-store is the organisation's (devops Q: which store, inside the residency).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: working-postgres-secret
  namespace: uc-invoice-intake
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: corporate-store
    kind: ClusterSecretStore
  target:
    name: working-postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: WORKING_DATABASE_URL
    remoteRef:
      key: invoice-intake/working-postgres-secret
      property: WORKING_DATABASE_URL
