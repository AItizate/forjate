# against the target cluster's sealed-secrets controller (the env-example-check and secrets-check gates read this file).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-ssh-keys
  namespace: argocd
spec:
  encryptedData:
    ssh_config: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from argocd-ssh-keys.env.example
    id_ed25519: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from argocd-ssh-keys.env.example
  template:
    metadata:
      name: argocd-ssh-keys
      namespace: argocd
    type: Opaque
