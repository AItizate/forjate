# NetworkPolicies for uc-invoice-intake-baseline at walk: the PSA exception namespace of invoice-intake (security: psa_exceptions), default-deny like uc-invoice-intake.
# Components: apps/ai-models/ollama, apps/ai-models/litellm, apps/databases/postgres, apps/document-processing/docling, bundles/temporal-stack, apps/auth/gotrue-auth. Egress to anything outside the cluster is not allowed here; add it by hand if one of them needs it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: uc-invoice-intake-baseline
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: uc-invoice-intake-baseline
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: uc-invoice-intake-baseline
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-uc-invoice-intake
  namespace: uc-invoice-intake-baseline
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake
    ports:
    - protocol: TCP
      port: 5001
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 7233
    - protocol: TCP
      port: 9999
---
# Hand edit (security shared-model-endpoint, G-ARCH-7): from the use case's namespace only worker reaches the gateway, and nothing reaches the model server directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-worker-to-gateway
  namespace: uc-invoice-intake-baseline
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake
      podSelector:
        matchLabels:
          app: worker
    ports:
    - protocol: TCP
      port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: uc-invoice-intake-baseline
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
