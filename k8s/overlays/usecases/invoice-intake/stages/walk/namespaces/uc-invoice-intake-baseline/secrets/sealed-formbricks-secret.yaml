kind: SealedSecret
metadata:
  name: formbricks-secret
  namespace: uc-invoice-intake-baseline
spec:
  encryptedData:
    NEXTAUTH_SECRET: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from formbricks-secret.env.example
    ENCRYPTION_KEY: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from formbricks-secret.env.example
    CRON_SECRET: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from formbricks-secret.env.example
    DATABASE_URL: AgAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # placeholder: run the seal command from formbricks-secret.env.example
  template:
    metadata:
      name: formbricks-secret
      namespace: uc-invoice-intake-baseline
    type: Opaque
