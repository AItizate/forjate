# NetworkPolicies for uc-invoice-intake at walk, generated from decisions/security.yaml (network_policy: default-deny,
# egress_allowlist: 2 external host(s)) and the in-cluster allows derived from the scaffold's workloads and the components.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: uc-invoice-intake
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: uc-invoice-intake
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inv-seed-egress
  namespace: uc-invoice-intake
spec:
  podSelector:
    matchLabels:
      app: inv-seed
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ollama
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - podSelector:
        matchLabels:
          app: litellm
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 4000
  - to:
    - podSelector:
        matchLabels:
          app: gotrue
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 9999
  - to:
    - podSelector:
        matchLabels:
          app: docling
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 5001
  - to:
    - podSelector:
        matchLabels:
          app: postgres
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - podSelector:
        matchLabels:
          app: formbricks
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - podSelector:
        matchLabels:
          app: erp-stub
    ports:
    - protocol: TCP
      port: 8001
