# NetworkPolicies for uc-invoice-intake at walk: default-deny (security network_policy) and the per-workload egress matrix (security egress_matrix: required, G-ARCH-7, SECBASE item 2).
# Hand-written over the generator, whose blanket policies gave every pod Odoo, IMAP and the gateway. Run inherits this file.
#
# workload                  temporal  postgres  minio  docling  gateway  doubles  external
# cron-job                  yes       yes       yes    -        -        -        IMAP
# worker                    yes       yes       yes    yes      yes      -        Odoo
# posting-worker            yes       yes       -      -        -        -        Odoo
# review-api                yes       yes       yes    -        -        -        -
# seed-job                  -         yes       yes    -        -        yes      -
# verify-job                yes       yes       yes    yes      -        yes      -
# invoice-intake-eval       -         yes       yes    yes      -        yes      -
# odoo-stub, mailbox stub   -         yes       -      -        -        -        -
#
# From the records: the external column, gateway on worker only, no model route on posting-worker, postgres on posting-worker.
# ASSUMED from the scaffold's routes and the architecture rationale, for the security owner to read under its Q13: the rest.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: uc-invoice-intake
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: uc-invoice-intake
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-cron-job
  namespace: uc-invoice-intake
  annotations:
    forjate.io/egress-host: imap.corp.example.com:993
    forjate.io/note: 'NetworkPolicy has no FQDN selector: replace the cidr with the resolved address range of this host, or use the CNI''s FQDN policy (CiliumNetworkPolicy toFQDNs)'
spec:
  podSelector:
    matchLabels:
      app: cron-job
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
      podSelector:
        matchLabels:
          app: temporal-server
    ports:
    - protocol: TCP
      port: 7233
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: uc-invoice-intake-baseline
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - ipBlock:
        cidr: 203.0.113.0/32
    ports:
    - protocol: TCP
      port: 993
---
