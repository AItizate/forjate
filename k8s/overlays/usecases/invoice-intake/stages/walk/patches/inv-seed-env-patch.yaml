# walk: the real model and the real systems (strategic merge on the container name, order-independent).
apiVersion: batch/v1
kind: Job
metadata:
  name: inv-seed
spec:
  template:
    spec:
      containers:
      - name: inv-seed
        env:
        - name: MODEL_MODE
          value: live
        - name: ERP_URL
          value: https://odoo.corp.example.com
