# Walk Jobs hold the two tenant credentials, never the admin login (data-store). The test fails the build if envFrom/0 ever stops being the secret this replaces.
- op: test
  path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
  value: postgres-secret
- op: replace
  path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
  value: working-postgres-secret
- op: add
  path: /spec/template/spec/containers/0/envFrom/1
  value:
    secretRef:
      name: episodic-postgres-secret
