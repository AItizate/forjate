# The doubles keep their state on the working database only (PgKV reads working_dsn), so they hold the working credential alone.
- op: test
  path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
  value: postgres-secret
- op: replace
  path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
  value: working-postgres-secret
