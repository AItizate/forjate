# Two ExternalSecrets through ClusterSecretStore openbao (eso-store). verify.sh
# expects the first to sync and the second to be refused: the store's policy
# reads kv/data/workloads/* and nothing else. A short refresh keeps verify fast.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-workload
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-workload
  data:
    - secretKey: value
      remoteRef:
        key: workloads/demo
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forbidden-agent-path
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forbidden-agent-path
  data:
    - secretKey: value
      remoteRef:
        key: agents/uc-agent-k8s/creds
        property: value
