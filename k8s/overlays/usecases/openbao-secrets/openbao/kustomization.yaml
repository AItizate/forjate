apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenBao with every sub-component, moved out of its default namespace the way a
# tenant does it: `namespace:` plus the follow-namespace transformer, which points
# the ClusterRoleBinding subject and the ClusterSecretStore server at it. Kept in a
# kustomization of its own so this `namespace:` does not reach External Secrets or
# the use-case namespace.

namespace: openbao

resources:
  - ../../../../components/apps/security/openbao

components:
  - ../../../../components/apps/security/openbao/seal-static
  - ../../../../components/apps/security/openbao/raft-snapshot
  - ../../../../components/apps/security/openbao/eso-store

transformers:
  - ../../../../components/apps/security/openbao/follow-namespace
