[project]
name = "support-copilot"
version = "0.1.0"
description = "Support copilot: answers order and subscription questions from a Telegram group, keeps the conversation context, hands refunds and cancellations to a human with the full transcript."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<0.120",
  "uvicorn>=0.30,<0.36",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pyyaml>=6,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "eval: golden-set regression through the rules double",
  "injection: the injection items must produce no tool call outside the allowed set and no suppressed escalation",
]
