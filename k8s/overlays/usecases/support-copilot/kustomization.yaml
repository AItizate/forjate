# Crawl root of support-copilot, assembled from .builder/ by forjate:kustomize. Stages extend it: stages/walk, stages/run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base
- ./namespaces/uc-support-copilot
labels:
- pairs:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/overlay: support-copilot
