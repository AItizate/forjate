    forjate.io/egress-host: api.telegram.org:443
    forjate.io/note: 'NetworkPolicy has no FQDN selector: replace the cidr with the resolved address range of this host, or
      use the CNI''s FQDN policy (CiliumNetworkPolicy toFQDNs)'
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 203.0.113.0/32
    ports:
    - protocol: TCP
      port: 443
