# walk: the real model and the real systems (strategic merge on the container name, order-independent).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
spec:
  template:
    spec:
      containers:
      - name: agent-api
        env:
        - name: MODEL_MODE
          value: live
        - name: ORDERS_URL
          value: https://orders.corp.example.com
