# walk: the real model and the real systems (strategic merge on the container name, order-independent).
apiVersion: batch/v1
kind: Job
metadata:
  name: copilot-seed
spec:
  template:
    spec:
      containers:
      - name: copilot-seed
        env:
        - name: MODEL_MODE
          value: live
        - name: ORDERS_URL
          value: https://orders.corp.example.com
