# walk: the build so far with the PSA exceptions moved out of uc-support-copilot (security: psa_exceptions) and the components walk no longer runs deleted (apps/ai-models/ollama).
# A layer of its own because the aliases left in the use case's namespace would collide with the originals here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../namespaces/uc-support-copilot
patches:
- target:
    kind: Service
    name: ollama-service
    namespace: uc-support-copilot
  patch: "# apps/ai-models/ollama ran at crawl and no record chooses it at walk\n$patch: delete\nkind: Service\nmetadata:\n\
    \  name: ollama-service\n"
- target:
    kind: StatefulSet
    name: ollama
    namespace: uc-support-copilot
  patch: "# apps/ai-models/ollama ran at crawl and no record chooses it at walk\n$patch: delete\nkind: StatefulSet\nmetadata:\n\
    \  name: ollama\n"
- target:
    kind: PersistentVolumeClaim
    name: pvc-ollama
    namespace: uc-support-copilot
  patch: "# apps/ai-models/ollama ran at crawl and no record chooses it at walk\n$patch: delete\nkind: PersistentVolumeClaim\n\
    metadata:\n  name: pvc-ollama\n"
