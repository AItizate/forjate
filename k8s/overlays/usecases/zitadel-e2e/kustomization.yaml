apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Zitadel v4 with Login V2 and PostgreSQL, validated end to end on k3d. Everything lives in one
# namespace, uc-zitadel-e2e (Zitadel, its login service, PostgreSQL, the bootstrap Job and the
# lifecycle Jobs). No ../../../base: nothing here needs Traefik, cert-manager or MinIO (the
# Ingress of the component is rendered and stays inert without a controller).

resources:
  - namespaces/uc-zitadel-e2e

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/overlay: zitadel-e2e
