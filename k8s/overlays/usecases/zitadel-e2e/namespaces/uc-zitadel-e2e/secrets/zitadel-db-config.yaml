# Becomes the key config-yaml of the Secret zitadel-db-config (contract.yaml). Placeholders
# only: the cluster lives for one run. Same shape as docs/examples/zitadel-tenant/secrets/.
#
# No TLS in k3d: the issuer is plain http on port 80 (the Service gets a second port,
# see ../kustomization.yaml). ExternalSecure/ExternalPort are what make Zitadel advertise
# that issuer.
ExternalDomain: zitadel.uc-zitadel-e2e.svc.cluster.local
ExternalSecure: false
ExternalPort: 80
FirstInstance:
  Org:
    Human:
      Email:
        # Distinct from every email in bootstrap.yaml (assertion 5 makes one equal on purpose).
        Address: zitadel-admin@e2e.example.test
Database:
  postgres:
    User:
      Username: zitadel
      Password: e2e-placeholder-db-password
    Admin:
      Username: zitadel
      Password: e2e-placeholder-db-password
