          owner: security
          check: { type: manual, ref: kill-switch-rehearsal }
        - id: G-SEC-24
          text: "Rotation rehearsal by tenant IT (ASSUMED, business Q2): re-seal every secret with the script, consumers restart, the use case still works."
          owner: security
          check: { type: manual, ref: rotation-rehearsal }
        - id: G-SEC-25
          text: >-
            The verify Job calls post_invoice with no token, an expired token, a spent token, a token over changed
