            and the approving identity.
          owner: security
          check: { type: verify-job, ref: invoice-intake-verify }
        - id: G-SEC-27
          text: >-
            The security owner reviews access: each persona has its own IdP group with the verbs in access_by_persona,
            no shared login reaches the review queue, and agent ServiceAccounts mount no token and have no RoleBinding.
          owner: security
          check: { type: manual, ref: access-review }
        - id: G-SEC-17
          text: The security owner accepts in writing, or refuses, each PSA exception of this stage, with platform-team for the shared namespaces.
          owner: security
          check: { type: manual, ref: psa-exception-acceptance }
        - id: G-SEC-28
          text: The sealed-secrets controller key is backed up offsite, inside the EU, before any real secret is sealed.
          owner: devops
          check: { type: manual, ref: sealed-secrets-key-backup }
        - id: G-SEC-18
          text: Volumes holding financial data are encrypted at rest, each workload has its own bucket credential, and only the audit role can read the audit bucket.
          owner: security
          check: { type: manual, ref: storage-access-review }
        - id: G-SEC-38
          text: >-
            The verify Job proves the Odoo credential scopes: post_invoice's cannot read, change or pay; find_payable's
