          check: { type: ci, ref: litellm-egress-check }
        - id: G-SEC-21
          text: The ArgoCD Application's targetRevision is a tag or commit and selfHeal is true; the devops record carries the setting.
          owner: security
          check: { type: ci, ref: argocd-revision-check }
