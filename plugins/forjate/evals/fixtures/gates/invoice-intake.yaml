          check: { type: ci, ref: psa-check }
        - id: G-SEC-15
          text: "SECBASE 2: every architecture workload has its own NetworkPolicy, so egress is allow-listed per workload."
          owner: security
          check: { type: ci, ref: netpol-matrix-check }
        - id: G-SEC-19
          text: "SECBASE 3: the secret scan covers configMapGenerator literals, configs/, patches and inline env values, workload manifests and non-ignored .env files, with no finding."
          owner: security
