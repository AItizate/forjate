apiVersion: forjate.io/v0
kind: ContextPack
metadata:
  name: cost-cap
  version: 1.0.0
  scope: team
  precedence: 30
  description: Eval fixture for forjate:business. A hard monthly cap below the factory's Walk and Run defaults.
spec:
  applies_to: [business]
  language: en
  sources:
    - id: COST-1
      kind: constraint
      path: constraints.yaml#/rules/COST-1
      enforce: must
      applies_to: [business]
      summary: No stage may cost more than 50 USD per month, infrastructure and inference included.
    - id: COST-2
      kind: constraint
      path: constraints.yaml#/rules/COST-2
      enforce: must
      applies_to: [business]
      summary: Every stage must name a payback period in months.
