rules:
  OPS-1:
    type: deny_components
    value: [apps/continuous-delivery/argocd]
    reason: Flux is the org standard; two GitOps engines are not supported.
  OPS-2:
    type: require_components
    value: [apps/security/openbao]
    stages: [walk, run]
    reason: The corporate secrets store runs in-cluster as OpenBao; pilots pull from it instead of holding secrets in git.
  OPS-3:
    type: max_cost_usd_month
    value: 100
    stages: [walk]
    reason: Pilot infrastructure budget.
