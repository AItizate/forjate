apiVersion: forjate.io/v0
kind: ContextPack
metadata:
  name: flux-shop
  version: 1.0.0
  scope: org
  precedence: 20
  description: Eval fixture for forjate:devops. Forbids ArgoCD, mandates Vault from the pilot onwards and caps the Walk budget.
spec:
  applies_to: [devops]
  language: en
  sources:
    - id: OPS-1
      kind: constraint
      path: constraints.yaml#/rules/OPS-1
      enforce: must
      applies_to: [devops]
      summary: The org GitOps standard is Flux; ArgoCD is not approved.
    - id: OPS-2
      kind: constraint
      path: constraints.yaml#/rules/OPS-2
      enforce: must
      applies_to: [devops]
      summary: Secrets come from the corporate Vault from the pilot onwards.
    - id: OPS-3
      kind: constraint
      path: constraints.yaml#/rules/OPS-3
      enforce: must
      applies_to: [devops]
      summary: Pilots run on 100 USD a month of infrastructure.
