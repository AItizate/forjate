apiVersion: forjate.io/v0
kind: ContextPack
metadata:
  name: us-only
  version: 1.0.0
  scope: team
  precedence: 30
  description: Eval fixture (layered over regulated-corp) for forjate:compliance. Pins residency to the US and bans AGPL components.
spec:
  applies_to: [compliance]
  language: en
  sources:
    - id: RES-1
      kind: constraint
      path: constraints.yaml#/rules/RES-1
      enforce: must
      applies_to: [compliance]
      summary: The only approved data centre is in the US.
    - id: LIC-1
      kind: constraint
      path: constraints.yaml#/rules/LIC-1
      enforce: must
      applies_to: [compliance]
      summary: AGPL software is banned by legal; MinIO included.
