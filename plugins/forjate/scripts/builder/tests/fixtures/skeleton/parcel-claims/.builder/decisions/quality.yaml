apiVersion: forjate.io/v0
kind: Decision
metadata: { area: quality, usecase: parcel-claims, author: "forjate:quality", version: 1 }
spec:
  stages:
    crawl:
      choice: []
      settings:
        verify_job: claims-verify
        verify_assertions:
          - 10 reports processed, each reaches the carrier stub once
          - a second run changes no counts
