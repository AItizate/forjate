    capabilities: [secrets-mechanism]
    maturity: mvp
    gpu_required: none
    ha: unknown
    psa_restricted: unknown
    namespace: kube-system
    psa_level: baseline
    secrets:
      takes: none
      mechanism: sealed-secrets
      rank: 1
    data_classes: [secret]
    licence: Apache-2.0
    notes: Encrypted SealedSecrets committed next to the overlay; the floor for secrets in git from Walk. The controller key is the single point of loss — its backup is a devops gate.
  apps/security/external-secrets:
    stages: [run]
    capabilities: [secrets-mechanism]
    gpu_required: none
    ha: unknown
    psa_restricted: unknown
