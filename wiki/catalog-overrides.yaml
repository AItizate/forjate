    data_classes: [internal, pii, financial, health]
    licence: Apache-2.0
    notes: Source Postgres (logical decoding), sink RabbitMQ.
  apps/cdc/debezium-mongo-nats:
    stages: [walk, run]
    capabilities: [cdc]
    gpu_required: none
    ha: single
    psa_restricted: false
    data_classes: [internal, pii, financial, health]
