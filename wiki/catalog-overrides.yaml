# Curated facts about catalog components that cannot be derived from k8s/**.
# Merged into wiki/catalog.json by scripts/wiki-compile.py. Keys are component
# paths relative to k8s/components/. Anything not listed here appears in the
# catalog with `curated: false` and the conservative `defaults`.
#
# Fields:
#   stages         which Crawl/Walk/Run stages the component is a sensible fit for;
#                  [] means "in the tree but never chosen" (deprecated)
#   capabilities   the needs it covers, from wiki/catalog-capabilities.yaml; the
#                  compiler rejects a capability that file does not define
#   maturity       lab | mvp | production — how battle-tested the component is in this factory
#   gpu_required   required | optional | none | unknown
#   ha             single (one replica, data lost with the node) | replicated (several
#                  replicas with their own replication) | operator (a CRD; HA is a
#                  config change) | n/a (no pods) | unknown
#   psa_restricted true when the shipped manifests run under Pod Security Admission
#                  `restricted` (runAsNonRoot, seccomp, drop ALL, no privilege
#                  escalation) | false | n/a (no pods) | unknown (vendored or remote)
#   psa_level      derived, override only where the tree cannot be read: the strictest Pod
#                  Security Standard the shipped pods meet — privileged (host access) |
#                  baseline | restricted | n/a | unknown (Helm or remote manifests). The
#                  compiler reads it from the pod templates; psa_restricted true implies
#                  restricted, and a curated value the manifests contradict is an error
#   namespace      derived, override only where the tree cannot be read: the namespace a
#                  shared component runs in, never the use case's. The compiler reads the
#                  kustomization's namespace, the manifests' metadata.namespace and Helm
#                  charts; set it for remote manifests, and `null` for a component whose
#                  manifests pin a namespace but that belongs in the use case's namespace.
#                  An override the manifests contradict is an error. The catalog adds
#                  namespace_how: declares (ships the Namespace) | remote (Helm or remote
#                  manifests carry it) | sets (uses it, declares nothing) | none (the
#                  overlay places it)
#   secrets        takes: how it receives credentials — none | env (a Secret the overlay
#                  supplies) | sealed (ships a sealed-secret example) | unknown
#                  mechanism, rank: only on secrets-mechanism components — the value of
#                  the `secrets_mechanism` setting and its strength (validate.py ranks
#                  a pack's requirement through these; `secret-generator` is rank 0)
#   data_classes   classes the component can hold or transit when configured for it
#                  (auth, TLS, encrypted storage are overlay work): internal | pii |
#                  financial | health | secret. [] = touches no use-case data.
#   licence        upstream licence, for forjate:compliance. Verify before relying on it.
#   notes          one line for the experts
defaults:
  stages: [crawl, walk, run]
  capabilities: []
  maturity: lab
  gpu_required: unknown
  ha: unknown
  psa_restricted: unknown
  secrets:
    takes: unknown
  data_classes: [internal]

components:
  apps/databases/postgres:
    stages: [crawl, walk, run]
    capabilities: [working-memory, episodic-memory]
    maturity: mvp
    gpu_required: none
    ha: single
    psa_restricted: false
    secrets:
      takes: env
    data_classes: [internal, pii, financial, health]
    licence: PostgreSQL
    notes: Default system of record. Single StatefulSet; move to an operator (CNPG) at Run for HA/PITR. Mounts `postgres-secret`.
  apps/databases/redis:
    stages: [crawl, walk, run]
    capabilities: [session-memory, cache]
    maturity: mvp
    gpu_required: none
    ha: single
    psa_restricted: false
    secrets:
      takes: env
    data_classes: [internal, pii, financial, health]
    licence: BSD-3 (7.2) / RSALv2+SSPL (7.4+)
    notes: Short-term memory, rate limiting and locks; memory-bound, name the eviction policy. Check the image tag against the licence change.
  apps/databases/mongodb:
    stages: [crawl, walk]
    capabilities: [episodic-memory]
    maturity: lab
    gpu_required: none
    ha: single
    psa_restricted: false
    secrets:
      takes: env
    data_classes: [internal, pii, financial, health]
    licence: SSPL
    notes: Document-shaped chat state; SSPL is often disallowed in corporate packs. `mongodb/replica-set` adds the oplog CDC needs. Mounts `mongodb-secret`.
  apps/databases/mariadb:
    stages: [crawl, walk, run]
    capabilities: [working-memory, episodic-memory]
    maturity: lab
    gpu_required: none
    ha: single
    psa_restricted: false
    secrets:
      takes: env
    data_classes: [internal, pii, financial, health]
    licence: GPL-2.0
    notes: The relational alternative when a pack denies Postgres.
  apps/databases/lancedb:
    stages: [crawl, walk]
    capabilities: [semantic-memory]
    maturity: lab
    gpu_required: none
    ha: single
    psa_restricted: false
    data_classes: [internal, pii, financial, health]
    licence: Apache-2.0
    notes: Embedded-style vector store served over HTTP; single writer, so concurrent ingestion is the limit. Cheapest semantic memory for Crawl.
  apps/databases/milvus:
    stages: [walk, run]
    capabilities: [semantic-memory]
    maturity: lab
    gpu_required: none
    ha: single
    psa_restricted: false
    data_classes: [internal, pii, financial, health]
    licence: Apache-2.0
    notes: Heavier; needs etcd + MinIO. Reach for it when LanceDB's single-writer model is the bottleneck.
  apps/databases/etcd:
    stages: [walk, run]
    capabilities: [coordination]
    gpu_required: none
    ha: single
    psa_restricted: false
    data_classes: [internal]
    licence: Apache-2.0
